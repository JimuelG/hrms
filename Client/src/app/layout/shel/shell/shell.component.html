<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-slate-900/40 z-30 lg:hidden" (click)="sidebarOpen.set(false)"></div>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 w-60 border-r border-slate-200 dark:border-slate-800
           bg-white dark:bg-slate-900 flex flex-col transition-transform duration-200 lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()">
    <div class="flex items-center gap-2.5 px-5 h-14 border-b border-slate-200 dark:border-slate-800">
      <i class="fa-solid fa-building-columns text-indigo-600 dark:text-indigo-400 text-lg"></i>
      <span class="font-semibold text-sm tracking-tight">HRMS</span>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="!bg-indigo-600 !text-white dark:!bg-indigo-500"
           (click)="sidebarOpen.set(false)"
           class="flex items-center gap-3 px-3 py-2 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300
                  hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid {{ item.icon }} w-4 text-center text-[13px]"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="p-3 border-t border-slate-200 dark:border-slate-800">
      <button (click)="logout()"
        class="flex w-full items-center gap-3 px-3 py-2 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300
               hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950 dark:hover:text-red-400 transition-colors">
        <i class="fa-solid fa-arrow-right-from-bracket w-4 text-center text-[13px]"></i>
        Sign out
      </button>
    </div>
  </aside>

  <div class="lg:pl-60">
    <header class="sticky top-0 z-20 flex items-center justify-between h-14 px-4 lg:px-8
                    border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur">
      <button class="lg:hidden p-2 -ml-2 text-slate-500 dark:text-slate-400" (click)="sidebarOpen.set(true)">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="hidden lg:block"></span>
      <button (click)="theme.toggle()" title="Toggle theme"
        class="flex items-center justify-center w-8 h-8 rounded-md text-slate-500 dark:text-slate-400
               hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i class="fa-solid" [class.fa-moon]="!theme.isDark()" [class.fa-sun]="theme.isDark()"></i>
      </button>
    </header>

    <main class="p-4 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
