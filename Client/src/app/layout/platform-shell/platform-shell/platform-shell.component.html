<div class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
  <div class="bg-amber-600 text-white text-xs font-semibold text-center py-1.5 tracking-wide">
    PLATFORM ADMINISTRATION
  </div>

  <header class="flex items-center justify-between h-14 px-4 lg:px-8 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
    <div class="flex items-center gap-2.5">
      <i class="fa-solid fa-building-columns text-amber-600 text-lg"></i>
      <span class="font-semibold text-sm tracking-tight">HRMS Platform</span>
    </div>

    <nav class="flex items-center gap-1">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="!bg-amber-600 !text-white"
           class="flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300
                  hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i class="fa-solid {{ item.icon }} text-xs"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <button (click)="theme.toggle()" class="w-8 h-8 rounded-md text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fa-solid" [class.fa-moon]="!theme.isDark()" [class.fa-sun]="theme.isDark()"></i>
      </button>
      <button (click)="logout()" class="px-3 py-1.5 rounded-md text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950 dark:hover:text-red-400">
        Sign out
      </button>
    </div>
  </header>

  <main class="p-4 lg:p-8">
    <router-outlet />
  </main>
</div>
